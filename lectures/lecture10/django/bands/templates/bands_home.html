<html>
<head>
    <style>
        body {
            font-family: system-ui;
            margin: 1em 2em;
        }
    </style>
</head>
<body>

<h1>
    <a href="/bands/">My Bands App</a> 🤘
</h1>

<form action="/bands/" method="GET">
    {{ form }}
    <input type="submit" value="Search" />
</form>

{% if bands %}
<h2>Bands:</h2>
<ol>
    {% for band in bands %}
    <li>{{ band.name }} (started in {{ band.year }})</li>
    {% endfor %}
</ol>
{% endif %}

</body>
</html>
